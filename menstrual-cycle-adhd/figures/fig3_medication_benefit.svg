<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <rect x="270" y="20" width="360" height="52" rx="9" fill="#17191B"/>
  <text x="450" y="43" text-anchor="middle" font-size="13.5" font-weight="650" fill="#ffffff">"My medication works less well this week"</text>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#C9CDD1">at least four explanations remain open</text>
  <g stroke="#DEE0DC" stroke-width="1.5" fill="none">
    <path d="M450 72 L450 92 M115 92 L785 92 M115 92 L115 112 M338 92 L338 112 M562 92 L562 112 M785 92 L785 112"/>
  </g>
  <g font-size="12">
    <g>
      <rect x="30" y="112" width="170" height="120" rx="9" fill="#1F5FA8" opacity="0.09"/>
      <text x="46" y="136" font-weight="650" fill="#17191B" font-size="12.5">Lower exposure</text>
      <text x="46" y="158" fill="#63686D">Pharmacokinetic.</text>
      <text x="46" y="176" fill="#63686D">A stable prescribed</text>
      <text x="46" y="194" fill="#63686D">dose does not mean</text>
      <text x="46" y="212" fill="#63686D">a stable plasma level.</text>
    </g>
    <g>
      <rect x="253" y="112" width="170" height="120" rx="9" fill="#12805a" opacity="0.09"/>
      <text x="269" y="136" font-weight="650" fill="#17191B" font-size="12.5">Altered response</text>
      <text x="269" y="158" fill="#63686D">Pharmacodynamic.</text>
      <text x="269" y="176" fill="#63686D">Equal plasma levels</text>
      <text x="269" y="194" fill="#63686D">need not mean equal</text>
      <text x="269" y="212" fill="#63686D">drug effect.</text>
    </g>
    <g>
      <rect x="477" y="112" width="170" height="120" rx="9" fill="#c8501f" opacity="0.10"/>
      <text x="493" y="136" font-weight="650" fill="#17191B" font-size="12.5">More to carry</text>
      <text x="493" y="158" fill="#63686D">Greater background</text>
      <text x="493" y="176" fill="#63686D">impairment. The same</text>
      <text x="493" y="194" fill="#63686D">treatment effect,</text>
      <text x="493" y="212" fill="#63686D">a worse starting point.</text>
    </g>
    <g>
      <rect x="700" y="112" width="170" height="120" rx="9" fill="#4a3aa7" opacity="0.10"/>
      <text x="716" y="136" font-weight="650" fill="#17191B" font-size="12.5">Added burden</text>
      <text x="716" y="158" fill="#63686D">Sleep, pain and mood.</text>
      <text x="716" y="176" fill="#63686D">A separate load that</text>
      <text x="716" y="194" fill="#63686D">competes for the same</text>
      <text x="716" y="212" fill="#63686D">capacity.</text>
    </g>
  </g>
  <rect x="30" y="252" width="840" height="54" rx="9" fill="#F0F1EC"/>
  <text x="50" y="276" font-size="12.5" font-weight="650" fill="#17191B">These need different measurements and different interventions.</text>
  <text x="50" y="296" font-size="12" fill="#63686D">Separating them requires observed dosing with serial concentrations at verified endocrine states, and a randomized contrast rather than a before-and-after comparison.</text>
</svg>
