    <text x="801" y="296" text-anchor="middle">withdrawal</text>
  </g>
  <text x="70" y="320" font-size="11.5" fill="#63686D">Four physiologically distinct conditions. Concentration and rate of change are separate variables, and calendar dates alone can misclassify all four.</text>
