<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <g font-size="12.5">
    <g>
      <rect x="40" y="26" width="300" height="54" rx="8" fill="#4a3aa7" opacity="0.10"/>
      <text x="56" y="48" font-weight="650" fill="#17191B">Cell</text>
      <text x="56" y="68" fill="#63686D">COMT transcription in a cancer-cell line</text>
      <text x="370" y="58" fill="#63686D">Estradiol suppresses it in MCF-7, not in a glial line</text>
    </g>
    <g>
      <rect x="40" y="94" width="300" height="54" rx="8" fill="#1F5FA8" opacity="0.10"/>
      <text x="56" y="116" font-weight="650" fill="#17191B">Receptor</text>
      <text x="56" y="136" fill="#63686D">Striatal D2 binding, transporter availability</text>
      <text x="370" y="126" fill="#63686D">Three human PET or SPECT studies found no phase difference</text>
    </g>
    <g>
      <rect x="40" y="162" width="300" height="54" rx="8" fill="#12805a" opacity="0.10"/>
      <text x="56" y="184" font-weight="650" fill="#17191B">Task</text>
      <text x="56" y="204" fill="#63686D">Working memory, attention, processing speed</text>
      <text x="370" y="194" fill="#63686D">102 articles, 3,943 participants: no robust average phase effect</text>
    </g>
    <g>
      <rect x="40" y="230" width="300" height="54" rx="8" fill="#c8501f" opacity="0.11"/>
      <text x="56" y="252" font-weight="650" fill="#17191B">Day</text>
      <text x="56" y="272" fill="#63686D">Completing everyday responsibilities</text>
      <text x="370" y="262" fill="#63686D">Where the reported difficulty actually sits, and least measured</text>
    </g>
  </g>
  <line x1="20" y1="26" x2="20" y2="284" stroke="#DEE0DC" stroke-width="2"/>
  <text x="40" y="316" font-size="11.5" fill="#63686D">Evidence at one level can motivate a hypothesis at another without establishing its magnitude, direction or clinical importance.</text>
</svg>
