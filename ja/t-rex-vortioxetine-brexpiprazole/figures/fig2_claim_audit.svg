   <g id="matplotlib.axis_1"/>
   <g id="matplotlib.axis_2">
    <g id="ytick_1">
     <g id="line2d_1"/>
     <g id="text_1">
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(16.621281 47.84763)" textLength="121.770" lengthAdjust="spacingAndGlyphs">NGF誘導された神経芽の成長を促進する</text>
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(45.070156 56.422011)" textLength="84.460" lengthAdjust="spacingAndGlyphs">PC12細胞において</text>
     </g>
    </g>
    <g id="ytick_2">
     <g id="line2d_2"/>
     <g id="text_2">
      <!-- That effect is 5-HT$_{1A}$ and -->
      <g style="fill: #52514e" transform="translate(39.694031 72.775677)">
       <text x="0.0" y="0.953125" style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" textLength="86.139" lengthAdjust="spacingAndGlyphs">その効果は5-HT₁Aおよび</text>
      </g>
      <!-- IP$_3$/Ca$^{2+}$ mediated, not D$_2$ -->
      <g style="fill: #52514e" transform="translate(32.314031 83.152008)">
       <text x="0.0" y="0.53125" style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" textLength="93.803" lengthAdjust="spacingAndGlyphs">IP_3/Ca²⁺経路に依存し、D_2とは関係ない</text>
      </g>
     </g>
    </g>
    <g id="ytick_3">
     <g id="line2d_3"/>
     <g id="text_3">
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(20.030687 99.193818)" textLength="118.080" lengthAdjust="spacingAndGlyphs">樹突棘の密度を回復する</text>
      <!-- $+$ BDNF/TrkB, with an SSRI -->
      <g style="fill: #52514e" transform="translate(26.328031 107.791262)">
       <text x="0.0" y="-0.453125" style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" textLength="100.991" lengthAdjust="spacingAndGlyphs">+ BDNF/TrkB、SSRI併用時</text>
      </g>
     </g>
    </g>
    <g id="ytick_4">
     <g id="line2d_4"/>
     <g id="text_4">
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(48.735812 124.914319)" textLength="83.230" lengthAdjust="spacingAndGlyphs">その中で、いずれかが単独で、</text>
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(26.114062 133.511762)" textLength="112.750" lengthAdjust="spacingAndGlyphs">セロトニン系のパートナーなしで</text>
     </g>
    </g>
    <g id="ytick_5">
     <g id="line2d_5"/>
     <g id="text_5">
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(21.648906 150.563069)" textLength="120.130" lengthAdjust="spacingAndGlyphs">樹突の分岐を増加させる</text>
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(38.241094 159.13745)" textLength="89.380" lengthAdjust="spacingAndGlyphs">(Sholl, スパインの形態)</text>
     </g>
    </g>
    <g id="ytick_6">
     <g id="line2d_6"/>
     <g id="text_6">
      <text style="font-size: 8.2px;  text-anchor: end; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" x="124.564031" y="179.960117" transform="rotate(-0 124.564031 179.960117)" textLength="126.280" lengthAdjust="spacingAndGlyphs">海馬神経生成を促進する</text>
     </g>
    </g>
    <g id="ytick_7">
     <g id="line2d_7"/>
     <g id="text_7">
      <text style="font-size: 8.2px;  text-anchor: end; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" x="124.564031" y="205.638976" transform="rotate(-0 124.564031 205.638976)" textLength="107.420" lengthAdjust="spacingAndGlyphs">mTOR、PSD-95、GluA1に作用する</text>
     </g>
    </g>
    <g id="ytick_8">
     <g id="line2d_8"/>
     <g id="text_8">
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(39.150781 227.588117)" textLength="86.100" lengthAdjust="spacingAndGlyphs">人間のBDNFを変化させたり、</text>
      <text style="font-size: 8.2px;  fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(55.563594 236.185561)" textLength="65.600" lengthAdjust="spacingAndGlyphs">海馬体積を変化させたり</text>
     </g>
    </g>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 7.9px;  text-anchor: start; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" x="230.334969" y="50.660622" transform="rotate(-0 230.334969 50.660622)" textLength="130.350" lengthAdjust="spacingAndGlyphs">1紙でメーカーが共同研究を実施</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 7.9px;  text-anchor: start; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" x="230.334969" y="76.288255" transform="rotate(-0 230.334969 76.288255)" textLength="128.375" lengthAdjust="spacingAndGlyphs">同じ1紙で、クリーンな薬理学的データ</text>
   </g>
   <g id="text_11">
    <text style="font-style: italic; font-size: 7.9px;  text-anchor: start; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" x="230.334969" y="101.978224" transform="rotate(-0 230.334969 101.978224)" textLength="88.875" lengthAdjust="spacingAndGlyphs">2件の体内実験論文、1つの研究室で</text>
   </g>
