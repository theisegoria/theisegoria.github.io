   <g id="text_13">
    <text style="font-style: italic; font-size: 7.9px;  text-anchor: start; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" x="230.334969" y="153.324835" transform="rotate(-0 230.334969 153.324835)" textLength="53.325" lengthAdjust="spacingAndGlyphs">研究は存在しない</text>
   </g>
