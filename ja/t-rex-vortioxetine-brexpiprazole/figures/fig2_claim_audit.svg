   <g id="text_14">
    <text style="font-style: italic; font-size: 7.9px;  text-anchor: start; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" x="230.334969" y="179.043812" transform="rotate(-0 230.334969 179.043812)" textLength="140.225" lengthAdjust="spacingAndGlyphs">研究は存在しない；アリピプラゾールからの推定から</text>
   </g>
   <g id="PathCollection_4">
    <g clip-path="url(#pb3958270c4)">
