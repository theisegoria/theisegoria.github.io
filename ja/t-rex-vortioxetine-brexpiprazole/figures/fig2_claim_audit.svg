   <g id="text_16">
    <text style="font-style: italic; font-size: 7.9px;  text-anchor: start; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" x="230.334969" y="230.361414" transform="rotate(-0 230.334969 230.361414)" textLength="102.700" lengthAdjust="spacingAndGlyphs">まったく人間の可塑性データはない</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 7px;  text-anchor: start; fill: #8a8880;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.0px;font-style:normal" x="135.283156" y="36.394949" transform="rotate(-0 135.283156 36.394949)" textLength="36.400" lengthAdjust="spacingAndGlyphs">証拠</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 7px;  text-anchor: start; fill: #8a8880;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.0px;font-style:normal" x="230.334969" y="36.394949" transform="rotate(-0 230.334969 36.394949)" textLength="107.100" lengthAdjust="spacingAndGlyphs">その背後にある実際のメカニズム</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 10px;  text-anchor: start; fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:10.0px;font-style:normal" x="128.064031" y="11.259062" transform="rotate(-0 128.064031 11.259062)" textLength="226.500" lengthAdjust="spacingAndGlyphs">プラスティック性の主張を、一つずつ検証する</text>
