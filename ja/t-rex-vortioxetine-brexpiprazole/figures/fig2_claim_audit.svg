   <g id="text_15">
    <text style="font-style: italic; font-size: 7.9px;  text-anchor: start; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" x="230.334969" y="204.722672" transform="rotate(-0 230.334969 204.722672)" textLength="130.350" lengthAdjust="spacingAndGlyphs">研究は存在しない；他の結合剤からの借用</text>
   </g>
