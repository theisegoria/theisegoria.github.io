   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:9.0px;font-style:normal" transform="translate(136.331719 23.965384)" textLength="105.750" lengthAdjust="spacingAndGlyphs">観察: タスクBOLD値の低下</text>
    <text style="font-weight: 700; font-size: 9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:9.0px;font-style:normal" transform="translate(166.658906 34.313064)" textLength="42.750" lengthAdjust="spacingAndGlyphs">薬剤下</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(29.252306 87.897385)" textLength="44.635" lengthAdjust="spacingAndGlyphs">スパイクの数が少ない</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(30.463845 96.980348)" textLength="43.450" lengthAdjust="spacingAndGlyphs">同じ場合に</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(30.240423 106.063312)" textLength="41.475" lengthAdjust="spacingAndGlyphs">計算</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(98.596954 87.897385)" textLength="42.660" lengthAdjust="spacingAndGlyphs">同じスパイク,</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(95.234516 96.980348)" textLength="52.930" lengthAdjust="spacingAndGlyphs">低いATPコスト</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(104.854001 106.063312)" textLength="31.600" lengthAdjust="spacingAndGlyphs">1スパイクあたり</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(169.151289 87.843227)" textLength="40.685" lengthAdjust="spacingAndGlyphs">タスク状態での時間は短い</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(168.057016 96.92619)" textLength="51.350" lengthAdjust="spacingAndGlyphs">（より速い）</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(177.057461 106.11747)" textLength="31.600" lengthAdjust="spacingAndGlyphs">低い主観的</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(230.385476 87.897385)" textLength="60.435" lengthAdjust="spacingAndGlyphs">要求があるため、より少ない</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(232.79189 96.980348)" textLength="51.350" lengthAdjust="spacingAndGlyphs">努力が投資される</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(234.842804 106.063312)" textLength="55.300" lengthAdjust="spacingAndGlyphs">血管的:</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(312.237428 87.886276)" textLength="32.785" lengthAdjust="spacingAndGlyphs">基準CBFまたは</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(301.259514 96.969239)" textLength="54.905" lengthAdjust="spacingAndGlyphs">結合が変化</text>
    <text style="font-size: 7.9px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:7.9px;font-style:normal" transform="translate(298.962343 106.052202)" textLength="57.275" lengthAdjust="spacingAndGlyphs">本物の計算コストの低下</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 8px;  text-anchor: middle; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.0px;font-style:normal" x="84.60504" y="135.766452" transform="rotate(-0 84.60504 135.766452)" textLength="106.000" lengthAdjust="spacingAndGlyphs">混同因子: これらの条件では効率の主張は成立しない</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 8px;  text-anchor: middle; fill: #52514e;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.0px;font-style:normal" x="288.63216" y="135.766452" transform="rotate(-0 288.63216 135.766452)" textLength="158.000" lengthAdjust="spacingAndGlyphs">区別可能な測定: カリブレーションされたfMRI（ASL + BOLD + 高濃度二酸化炭素）</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.2px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" transform="translate(61.252375 165.172232)" textLength="267.730" lengthAdjust="spacingAndGlyphs">CMRO_2を回復；一定の精度で調整するのが難しいため、努力の混同を除去できる</text>
    <!-- recovers CMRO$_2$; difficulty titrated to constant accuracy removes the effort confound -->
    <g style="fill: #0b0b0b" transform="translate(47.338 174.801338)">
     <text x="0.0" y="0.953125" style="font-size: 8.2px;  fill: #0b0b0b;font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,sans-serif;font-size:8.2px;font-style:normal" textLength="284.709" lengthAdjust="spacingAndGlyphs">CMRO₂を推定する。正答率を一定に保つよう難易度を調整し、努力の交絡を取り除く。</text>
    </g>
   </g>
  </g>
 </g>
