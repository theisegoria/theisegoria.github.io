<svg xmlns="http://www.w3.org/2000/svg" width="430" height="300" viewBox="0 0 430 300" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">ボルチオキセチンによる回路の脱抑制</title><desc id="desc">GABA作動性介在ニューロン上の5-HT3A受容体を遮断すると錐体細胞が脱抑制される。神経伝達物質と回路レベルの結果は主にラットの研究に基づく。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52514e"/></marker><style>text{font-family:"Hiragino Sans","Yu Gothic",sans-serif;fill:#202124;text-anchor:middle;font-size:7px}.strong{font-size:8px;font-weight:700}.note{font-size:6.5px}.line{stroke:#52514e;fill:none;stroke-width:1}</style></defs>
<rect width="430" height="300" fill="white"/>
<rect x="7" y="8" width="94" height="47" rx="2" fill="#f1f6ff" stroke="#3885d7"/>
<text x="54" y="21" class="strong">ボルチオキセチン</text><text x="54" y="34">5-HT₃ 拮抗作用</text><text x="54" y="46">＋ SERT 遮断</text>
<path class="line" d="M102 32H146M146 27V37"/><text x="124" y="25" class="note">遮断</text>
<rect x="148" y="3" width="95" height="60" rx="2" fill="#f4f2fb" stroke="#6950bd"/>
<text x="195.5" y="16" class="strong">GABA作動性</text><text x="195.5" y="27" class="strong">介在ニューロン</text><text x="195.5" y="40">5-HT₃A はここに存在し、</text><text x="195.5" y="52">錐体細胞上には存在しない</text>
<path class="line" d="M244 32H286M286 27V37"/><text x="265" y="21" class="note">持続性IPSC</text>
<rect x="289" y="5" width="95" height="57" rx="2" fill="#eefaf5" stroke="#25a97f"/>
<text x="336.5" y="18" class="strong">錐体細胞</text><text x="336.5" y="31">脱抑制：誘発出力が増加し、</text><text x="336.5" y="43">持続性IPSCによる</text><text x="336.5" y="54">抑制の水準が低下</text>
<path class="line" d="M336 63V84H218V95" marker-end="url(#arrow)"/>
<rect x="13" y="97" width="409" height="105" rx="3" fill="#f5fbf9" stroke="#80c5b0"/>
<text x="217.5" y="110" class="strong">領域選択的な神経伝達物質の増加</text><text x="217.5" y="121">ラットのマイクロダイアリシス：内側前頭前野（mPFC）、腹側海馬</text>
<g fill="white" stroke="#bbb"><rect x="55" y="129" width="102" height="28" rx="2"/><rect x="167" y="129" width="102" height="28" rx="2"/><rect x="279" y="129" width="102" height="28" rx="2"/><rect x="55" y="164" width="102" height="29" rx="2"/><rect x="167" y="164" width="102" height="29" rx="2"/><rect x="279" y="164" width="102" height="32" rx="2"/></g>
<text x="106" y="140" class="strong">↑ グルタミン酸</text><text x="106" y="151">錐体細胞の出力</text>
<text x="218" y="140" class="strong">↑ アセチルコリン</text><text x="218" y="151">Mørk 2013, mPFC</text>
<text x="330" y="140" class="strong">↑ ヒスタミン</text><text x="330" y="151">Mørk 2013, mPFC</text>
<text x="106" y="176" class="strong">↑ ドパミン</text><text x="106" y="188">Mørk 2012</text>
<text x="218" y="176" class="strong">↑ ノルアドレナリン</text><text x="218" y="188">Mørk 2012</text>
<text x="330" y="175" class="strong">↑ セロトニン</text><text x="330" y="184" class="note">SERT遮断・背側縫線核（DRN）の</text><text x="330" y="192" class="note">発火の回復が速まる</text>
<rect x="13" y="217" width="409" height="76" rx="3" fill="#f5f6f8" stroke="#bbb"/>
<text x="217.5" y="230" class="strong">回路レベルの結果</text>
<text x="217.5" y="242" class="note">海馬LTP：154 ± 9%、溶媒対照 125 ± 7%（p = 0.0017）。</text>
<text x="217.5" y="251" class="note">エスシタロプラム 127 ± 5%（Dale 2014）。</text>
<text x="217.5" y="262" class="note">GluA1のSer845でリン酸化が増加。Ser831では増加せず、総GluA1量も変化しない（Waller 2017）。</text>
<text x="217.5" y="273" class="note">ラットの前頭部でθ波・γ波のパワーが増加。エスシタロプラムでは横ばいで、</text>
<text x="217.5" y="282" class="note">デュロキセチンではα波が低下（Leiser 2014）。</text>
</svg>
