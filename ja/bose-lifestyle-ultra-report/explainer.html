.form-control:disabled,

.form-select {

.form-select:focus-visible {

.form-check {

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

.form-switch .form-check-input:disabled,

}

.form-range::-moz-range-track {

.form-range::-moz-range-thumb {

  height: 20px;

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById('bose-ultra-explainer');
  const level = root.querySelector('#bose-level');

  const bassLayer = root.querySelector('#bose-bass-layer');
  const spatialLayer = root.querySelector('#bose-spatial-layer');

  const summary = root.querySelector('#bose-state-summary');
  const svg = root.querySelector('#bose-acoustic-svg');
  let mode = 'bass';

  function update() {
    const value = Number(level.value);
    levelValue.textContent = `${value}%`;
    if (mode === 'bass') {
      const protection = value &lt; 65 ? &quot;残余は利用可能&quot; : value &lt; 85 ? &quot;制限の開始&quot; : &quot;深層低音圧縮が有効&quot;;
      const excursion = value &lt; 50 ? 'low' : value &lt; 78 ? 'moderate' : &quot;高音 - 活性的に制約されている&quot;;
      root.querySelector('#bose-excursion-label').textContent = excursion;
      root.querySelector('#bose-port-label').textContent = value &lt; 40 ? 'light' : &quot;近傍チューニングで強い&quot;;
      root.querySelector('#bose-protect-label').textContent = `DSPエコライゼーションが有効 - ${protection}`;
      root.querySelector('.woofer').setAttribute('r', String(42 + value / 22));
      root.querySelector('#bose-woofer-wave').style.strokeWidth = String(2 + value / 35);
      root.querySelector('#bose-port-wave').style.strokeWidth = String(2 + Math.min(value, 82) / 30);

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
