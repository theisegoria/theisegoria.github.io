<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <g font-size="12.5">
    <g>
      <rect x="40" y="26" width="300" height="54" rx="8" fill="#4a3aa7" opacity="0.10"/>
      <text x="56" y="48" font-weight="650" fill="#17191B">細胞</text>
      <text x="56" y="68" fill="#63686D">がん細胞株での COMT 転写調節</text>
      <text x="370" y="58" fill="#63686D">MCF-7 では抑制、グリア系細胞株では反応なし</text>
    </g>
    <g>
      <rect x="40" y="94" width="300" height="54" rx="8" fill="#1F5FA8" opacity="0.10"/>
      <text x="56" y="116" font-weight="650" fill="#17191B">受容体</text>
      <text x="56" y="136" fill="#63686D">線条体 D2 結合、トランスポーター利用能</text>
      <text x="370" y="126" fill="#63686D">ヒトの PET・SPECT 3 研究で周期相差を認めず</text>
    </g>
    <g>
      <rect x="40" y="162" width="300" height="54" rx="8" fill="#12805a" opacity="0.10"/>
      <text x="56" y="184" font-weight="650" fill="#17191B">課題</text>
      <text x="56" y="204" fill="#63686D">ワーキングメモリ、注意、処理速度</text>
      <text x="370" y="194" fill="#63686D">102 論文 3,943 人：平均的な周期相効果は頑健でない</text>
    </g>
    <g>
      <rect x="40" y="230" width="300" height="54" rx="8" fill="#c8501f" opacity="0.11"/>
      <text x="56" y="252" font-weight="650" fill="#17191B">日常</text>
      <text x="56" y="272" fill="#63686D">日常の責務の遂行</text>
      <text x="370" y="262" fill="#63686D">報告される困難が実際に生じる階層。最も測定されていない</text>
    </g>
  </g>
  <line x1="20" y1="26" x2="20" y2="284" stroke="#DEE0DC" stroke-width="2"/>
  <text x="40" y="316" font-size="11.5" fill="#63686D">ある階層の知見は別の階層の仮説の根拠となり得るが、効果の大きさ、方向、臨床的重要性を確立するものではない。</text>
</svg>
