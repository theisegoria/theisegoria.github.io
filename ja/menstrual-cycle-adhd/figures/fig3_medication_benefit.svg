<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <rect x="250" y="20" width="400" height="52" rx="9" fill="#17191B"/>
  <text x="450" y="43" text-anchor="middle" font-size="13.5" font-weight="650" fill="#ffffff">「今週は薬が効きにくい」</text>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#C9CDD1">少なくとも 4 つの説明が残る</text>
  <g stroke="#DEE0DC" stroke-width="1.5" fill="none">
    <path d="M450 72 L450 92 M115 92 L785 92 M115 92 L115 112 M338 92 L338 112 M562 92 L562 112 M785 92 L785 112"/>
  </g>
  <g font-size="12">
    <g>
      <rect x="30" y="112" width="170" height="120" rx="9" fill="#1F5FA8" opacity="0.09"/>
      <text x="46" y="136" font-weight="650" fill="#17191B" font-size="12.5">曝露量の低下</text>
      <text x="46" y="158" fill="#63686D">薬物動態の問題。</text>
      <text x="46" y="176" fill="#63686D">処方量が一定でも</text>
      <text x="46" y="194" fill="#63686D">血中濃度が一定とは</text>
      <text x="46" y="212" fill="#63686D">限らない。</text>
    </g>
    <g>
      <rect x="253" y="112" width="170" height="120" rx="9" fill="#12805a" opacity="0.09"/>
      <text x="269" y="136" font-weight="650" fill="#17191B" font-size="12.5">反応性の変化</text>
      <text x="269" y="158" fill="#63686D">薬力学の問題。</text>
      <text x="269" y="176" fill="#63686D">血中濃度が同等でも</text>
      <text x="269" y="194" fill="#63686D">薬理効果が同等とは</text>
      <text x="269" y="212" fill="#63686D">限らない。</text>
    </g>
    <g>
      <rect x="477" y="112" width="170" height="120" rx="9" fill="#c8501f" opacity="0.10"/>
      <text x="493" y="136" font-weight="650" fill="#17191B" font-size="12.5">背景の負荷増大</text>
      <text x="493" y="158" fill="#63686D">治療効果は同じでも</text>
      <text x="493" y="176" fill="#63686D">出発点が悪ければ</text>
      <text x="493" y="194" fill="#63686D">到達点も下がる。</text>
    </g>
    <g>
      <rect x="700" y="112" width="170" height="120" rx="9" fill="#4a3aa7" opacity="0.10"/>
      <text x="716" y="136" font-weight="650" fill="#17191B" font-size="12.5">付加的な負担</text>
      <text x="716" y="158" fill="#63686D">睡眠、疼痛、気分。</text>
      <text x="716" y="176" fill="#63686D">同じ資源を奪い合う</text>
      <text x="716" y="194" fill="#63686D">独立した負荷。</text>
    </g>
  </g>
  <rect x="30" y="252" width="840" height="54" rx="9" fill="#F0F1EC"/>
  <text x="50" y="276" font-size="12.5" font-weight="650" fill="#17191B">これらは必要な測定も介入も異なる。</text>
  <text x="50" y="296" font-size="12" fill="#63686D">区別には、確認された内分泌状態での観察下投与と経時的な濃度測定、および前後比較ではなく無作為化した比較が必要である。</text>
</svg>
