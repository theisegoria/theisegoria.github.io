<!-- /ISEGORIA:NAV --><main class="lab">
<div aria-label="曲線のプリセット" class="presets">
<button aria-pressed="true" data-a="-1" data-b="0" type="button">滑らか</button>
<button aria-pressed="false" data-a="-3" data-b="2" type="button">ノード</button>
<button aria-pressed="false" data-a="0" data-b="0" type="button">クスプ</button>
</div>
<div class="layout">
<div class="plot">
<svg aria-labelledby="curve-title curve-desc" id="curve" role="img" viewbox="0 0 760 430">
<title id="curve-title">3次曲線の実数上の点</title>
<desc id="curve-desc">係数aおよびbが変化するとグラフが更新される。</desc>
<g id="grid"></g>
<g id="axes"></g>
<path class="curve" id="upper"></path>
<path class="curve" id="lower"></path>
<circle class="singular" hidden="" id="singular-point" r="7"></circle>
</svg>
<p class="formula" id="formula">y² = x³ - x</p>
</div>
<div class="controls">
<div class="control">
<label for="a">係数a <output id="a-value">-1.00</output></label>
<input id="a" max="2" min="-4" step="0.05" type="range" value="-1"/>
</div>
<div class="control">
<label for="b">係数b <output id="b-value">0.00</output></label>
<input id="b" max="3" min="-3" step="0.05" type="range" value="0"/>
</div>
<div class="discriminant">
<span>重解テスト：4a³ + 27b²</span>
<strong id="disc-value">-4.000</strong>
</div>
<p aria-live="polite" class="status" id="status"><b>滑らか。</b> 3次曲線は重解を持たないため、勾配は曲線上で消えず、常に非ゼロである。</p>
</div>
</div>
</main>
<script>
    const svg = document.getElementById('curve');
    const upper = document.getElementById('upper');
    const lower = document.getElementById('lower');
    const point = document.getElementById('singular-point');
    const aInput = document.getElementById('a');
    const bInput = document.getElementById('b');
    const aValue = document.getElementById('a-value');
    const bValue = document.getElementById('b-value');
    const discValue = document.getElementById('disc-value');
    const formula = document.getElementById('formula');
    const status = document.getElementById('status');
    const buttons = [...document.querySelectorAll('[data-a]')];

    const frame = { left: 58, right: 730, top: 28, bottom: 390 };
    const domain = { xmin: -3.2, xmax: 3.2, ymin: -4.2, ymax: 4.2 };
    const sx = x => frame.left + (x - domain.xmin) / (domain.xmax - domain.xmin) * (frame.right - frame.left);
    const sy = y => frame.bottom - (y - domain.ymin) / (domain.ymax - domain.ymin) * (frame.bottom - frame.top);

    function makeSvg(name, attrs, parent) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', name);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      parent.appendChild(el);
      return el;
    }

    function drawAxes() {
      const grid = document.getElementById('grid');
      const axes = document.getElementById('axes');
      [-2, -1, 1, 2].forEach(x => makeSvg('line', { x1: sx(x), x2: sx(x), y1: frame.top, y2: frame.bottom, class: 'grid' }, grid));
      [-3, -2, -1, 1, 2, 3].forEach(y => makeSvg('line', { x1: frame.left, x2: frame.right, y1: sy(y), y2: sy(y), class: 'grid' }, grid));
      makeSvg('line', { x1: frame.left, x2: frame.right, y1: sy(0), y2: sy(0), class: 'axis' }, axes);
      makeSvg('line', { x1: sx(0), x2: sx(0), y1: frame.top, y2: frame.bottom, class: 'axis' }, axes);
      makeSvg('text', { x: frame.right - 10, y: sy(0) - 8, class: 'axis-label', 'text-anchor': 'end' }, axes).textContent = 'x';
      makeSvg('text', { x: sx(0) + 10, y: frame.top + 17, class: 'axis-label' }, axes).textContent = 'y';
      [-3, -2, -1, 1, 2, 3].forEach(x => {
        const t = makeSvg('text', { x: sx(x), y: sy(0) + 20, class: 'tick', 'text-anchor': 'middle' }, axes);
        t.textContent = x;
      });
    }

    function pathFor(sign, a, b) {
      let path = '';
      let drawing = false;
      const samples = 900;
      for (let i = 0; i <= samples; i += 1) {
        const x = domain.xmin + (domain.xmax - domain.xmin) * i / samples;
        const rhs = x * x * x + a * x + b;
        if (rhs >= 0) {
          const y = sign * Math.sqrt(rhs);
          if (y >= domain.ymin && y <= domain.ymax) {
            path += `${drawing ? 'L' : 'M'}${sx(x).toFixed(2)},${sy(y).toFixed(2)} `;
            drawing = true;
            continue;
          }
        }
        drawing = false;
      }
      return path;
    }

    function singularX(a, b) {
      if (Math.abs(a) < 1e-9 && Math.abs(b) < 1e-9) return 0;
      if (a >= 0) return null;
      const candidates = [Math.sqrt(-a / 3), -Math.sqrt(-a / 3)];
      return candidates.find(x => Math.abs(x * x * x + a * x + b) < 1e-6) ?? null;
    }

    function term(value, symbol) {
      if (Math.abs(value) < 1e-9) return '';
      const sign = value > 0 ? ' + ' : ' - ';
      const magnitude = Math.abs(value);
      const coefficient = Math.abs(magnitude - 1) < 1e-9 && symbol ? '' : Number(magnitude.toFixed(2));
      return `${sign}${coefficient}${symbol}`;
    }

    function update() {
      const a = Number(aInput.value);
      const b = Number(bInput.value);
      const test = 4 * a * a * a + 27 * b * b;
      const singular = Math.abs(test) < 1e-7;
      upper.setAttribute('d', pathFor(1, a, b));
      lower.setAttribute('d', pathFor(-1, a, b));
      aValue.value = a.toFixed(2);
      bValue.value = b.toFixed(2);
      discValue.textContent = test.toFixed(3);
      formula.textContent = `y² = x³${term(a, 'x')}${term(b, '')}`;

      const x0 = singular ? singularX(a, b) : null;
      if (x0 !== null) {
        point.hidden = false;
        point.setAttribute('cx', sx(x0));
        point.setAttribute('cy', sy(0));
        const kind = Math.abs(a) < 1e-9 && Math.abs(b) < 1e-9 ? "クスプ" : "ノード";
        status.innerHTML = `<b>${kind} において (${x0.toFixed(2)}, 0)。</b> 3次関数は重解を持つため、両方の偏導関数はその点でゼロになる。`;
      } else {
        point.hidden = true;
        status.innerHTML = "<b>滑らか。</b> 3次曲線は重解を持たないため、勾配は曲線上で消えず、常に非ゼロである。";
      }

      buttons.forEach(button => {
        const active = Math.abs(Number(button.dataset.a) - a) < 1e-9 && Math.abs(Number(button.dataset.b) - b) < 1e-9;
        button.setAttribute('aria-pressed', String(active));
      });
      document.getElementById('curve-desc').textContent = `${formula.textContent}. ${status.textContent}`;
    }

    buttons.forEach(button => button.addEventListener('click', () => {
      aInput.value = button.dataset.a;
      bInput.value = button.dataset.b;
      update();
    }));
    aInput.addEventListener('input', update);
    bInput.addEventListener('input', update);
    drawAxes();
    update();
  </script>
